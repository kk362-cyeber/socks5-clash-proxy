name: Update SOCKS5 Proxies and Generate Clash Config

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run script to generate proxy.yaml
        run: python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add proxy.yaml
          git commit -m "Auto update proxies" || echo "Nothing to commit"
          git push https://kk362-cyber:${{ secrets.GH_TOKEN }}@github.com/kk362-cyber/socks5-clash-proxy.git main
